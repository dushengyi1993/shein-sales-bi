<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SHEIN BI · 运营工作台</title>
<style>/* SHEIN BI current production styles. */
:root{--bg:#f6f3ee;--paper:#fffdf8;--ink:#20201d;--muted:#716b62;--line:#ded7cc;--line2:#c8beb0;--accent:#7357ff;--side:#171612;--shadow:0 18px 50px rgba(47,39,28,.08),inset 0 1px 0 rgba(255,255,255,.75)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0,rgba(115,87,255,.13),transparent 34rem),radial-gradient(circle at 100% 0,rgba(249,115,22,.12),transparent 34rem),linear-gradient(135deg,#fbf8f2,#f6f3ee 55%,#efe9df);color:var(--ink);font:14px/1.5 Inter,Geist,Aptos,'Segoe UI Variable','Microsoft YaHei',system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.sidebar{position:fixed;inset:18px auto 18px 18px;width:248px;padding:14px;border-radius:26px;background:linear-gradient(180deg,#1d1b17,#11100d);color:#fffaf0;box-shadow:0 24px 70px rgba(38,32,22,.18);display:flex;flex-direction:column}
.brand{padding:5px 6px 10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mark{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:#f8f4eb;color:#15130f;font-weight:880;letter-spacing:-.08em}
.brand h1{font-size:17px;line-height:1.05;margin:0;letter-spacing:-.055em}
.brand p{margin:2px 0 0;font-size:11px}
.brand p,.foot,.muted,.tiny,.note{color:var(--muted)}
.nav{display:grid;gap:4px;overflow:auto;min-height:0;flex:1;padding-right:2px}
.nav button{min-height:33px;border:0;border-radius:12px;background:transparent;color:#bdb5aa;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:#f8f4eb;color:#15130f}
.nav small{font-size:10px;opacity:.56;text-transform:uppercase;letter-spacing:.12em}
.account-box{margin-top:6px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.055);padding:6px 7px;color:#bdb5aa;font-size:12px;display:block;flex:0 0 auto}
.account-main{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.account-identity{min-width:0;display:flex;align-items:center;gap:0;white-space:nowrap}
.account-box .account-label{font-size:10.5px;letter-spacing:0;color:#8f877d;font-weight:760;white-space:nowrap}
.account-box .account-name{display:block;color:#fffaf0;font-size:12.5px;font-weight:860;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-box .account-meta{display:none}
.account-box .logout-btn{min-height:21px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#f8f4eb;color:#17130f;font-weight:820;justify-content:center;padding:0 7px;font-size:10.5px;white-space:nowrap}
.account-box .logout-btn:hover{background:#fffaf0;transform:none}
.side-note{margin-top:8px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.045);padding:9px;color:#bdb5aa;font-size:11px;flex:0 0 auto}
.side-note b{display:block;color:#fffaf0;margin-bottom:4px}
.side-status{margin-top:7px;border-top:1px solid rgba(255,255,255,.1);padding-top:7px;display:grid;gap:4px}
.side-status-head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8f877d;font-weight:850}
.side-status-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:baseline}
.side-status-row span{color:#8f877d;font-size:10.5px;white-space:nowrap}
.side-status-row strong{display:block;color:#efe8dc;font-size:10.5px;font-weight:720;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-status-row .audit-ok,.side-status-row .audit-warn,.side-status-row .audit-bad{font-size:10.5px!important}

.main{margin-left:282px;padding:16px 26px 72px 0}
.command{position:sticky;top:0;z-index:10;padding:16px 0 14px;backdrop-filter:blur(18px)}
.bar{border:1px solid rgba(222,215,204,.82);border-radius:24px;background:rgba(255,253,248,.88);box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:minmax(260px,1.25fr) 170px 150px 150px auto;gap:8px;align-items:center}
.field{min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;display:flex;align-items:center;gap:8px;padding:0 13px;min-width:0}
.field label{font-size:11px;color:#9c9489;white-space:nowrap}
.field input,.field select{width:100%;min-width:0;border:0;background:transparent;outline:0;color:var(--ink)}
.quick{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn,.quick button{border:1px solid var(--line);border-radius:999px;background:#fffdf8;color:var(--ink);min-height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:7px}
.btn:hover,.quick button:hover{border-color:var(--line2);transform:translateY(-1px)}
.btn.primary,.quick button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:18px;margin-bottom:18px}
.panel,.hero-main,.hero-side,.stat,.intro{border:1px solid var(--line);border-radius:24px;background:rgba(255,253,248,.9);box-shadow:var(--shadow)}
.hero-main{padding:28px 30px;min-height:270px;overflow:hidden;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#f7f2ea;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.eyebrow i{width:7px;height:7px;border-radius:99px;background:var(--accent)}
h2,h3,h4,p{margin-top:0}
.hero-title{font-size:clamp(33px,3.2vw,52px);line-height:1.02;letter-spacing:-.085em;margin:18px 0 12px}
.copy{max-width:860px;color:var(--muted);font-size:15px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-side{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.decision{padding:13px;border:1px solid var(--line);border-radius:17px;background:#f4efe7}
.decision b{display:block}
.decision span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px 17px;min-height:118px}
.stat-label{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
.stat-value{font-size:28px;font-weight:760;letter-spacing:-.065em;margin-top:10px}
.stat-note{font-size:12px;color:var(--muted);margin-top:7px}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:30px 0 13px}
.head h3{margin:0;font-size:24px;letter-spacing:-.055em}
.head p{margin:4px 0 0;color:var(--muted)}
.panel{padding:18px;overflow:hidden}
.panel h4{font-size:17px;margin-bottom:5px;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:12px;margin-bottom:13px}
.intro{padding:24px 26px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:end}
.intro h2{font-size:36px;line-height:1.05;letter-spacing:-.075em;margin:14px 0 8px}
.intro p{color:var(--muted);max-width:860px;margin:0}
.badge{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);background:#fffdf8;white-space:nowrap;font-size:12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fffdf8}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f5f0e8;color:#6d665d;font-size:11px;text-transform:uppercase;letter-spacing:.08em;z-index:1}
.num{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;line-height:1.38;font-weight:400}
.rank{display:grid;gap:8px}
.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:#fffdf8}
.rank-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row small{display:block;color:var(--muted)}
.owner{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11px;border:1px solid var(--line);background:#fff}
.dot{width:7px;height:7px;border-radius:99px;background:var(--accent)}
.status-grid{display:grid;grid-template-columns:minmax(170px,1.2fr) repeat(var(--cols,19),minmax(84px,1fr));min-width:1540px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fffdf8}
.cell{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}
.cell.headcell{background:#f5f0e8;color:#675f56;font-weight:760}
.cell.product{font-weight:700;position:sticky;left:0;background:#fffdf8;z-index:2}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;font-variant-numeric:tabular-nums}
.counts span{border-radius:8px;background:#f3eee7;padding:2px 4px;text-align:center}
.counts .on{background:#e8f7ee;color:#166534}
.counts .wait{background:#fff6d7;color:#8a5a00}
.counts .sold{background:#eee7ff;color:#5b21b6}
.counts .off{background:#f1f1f1;color:#57534e}
.chart{height:260px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fffdf8,#f7f2ea);padding:14px;display:flex;align-items:end;gap:4px}
.vbar{flex:1;min-width:4px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--accent),#b7a8ff)}
.empty,.loading,.error{border:1px dashed var(--line2);border-radius:18px;background:rgba(255,253,248,.72);padding:18px;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid #ded7cc;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}
.error{border-color:#f2b8b5;color:#b42318;background:#fff7f7}
.sects{display:flex;gap:8px;flex-wrap:wrap}
.sects span{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;background:#fffdf8}
.sects .ok{color:#166534}
.sects .loading-chip{color:#9a6500}
.sects .bad{color:#b42318}
.sects .stale,.sects .refreshing{color:#9a3412;border-color:#fed7aa;background:#fff7ed;font-weight:820}
.sects .refreshing{color:#7c2d12;background:#ffedd5}
.stale-notice{border:1px solid #f59e0b;border-radius:20px;background:linear-gradient(135deg,#fffbeb,#fff7ed);box-shadow:0 16px 40px rgba(180,83,9,.10);padding:14px 16px;margin:0 0 16px;color:#7c2d12}
.stale-notice strong{display:block;font-size:14px;margin-bottom:4px;color:#7c2d12}
.stale-notice p{margin:0 0 10px;color:#92400e;font-size:12px;line-height:1.5}
.stale-line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(245,158,11,.25);padding-top:8px;margin-top:8px}
.stale-line span{display:block;font-size:12px;color:#78350f;min-width:0}
.stale-line b{margin-right:8px;color:#b45309}
.stale-line em{display:block;margin-top:2px;font-style:normal;color:#b42318}
.stale-line .btn{min-height:28px;padding:0 10px;background:#fffaf0;border-color:#f1c27d;color:#7c2d12;white-space:nowrap}
.stale-line .btn:disabled{opacity:.58;cursor:wait}
.action{border:1px solid var(--line);border-radius:18px;background:#fffdf8;padding:15px;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;background:#f6f1e9;color:var(--muted)}
.danger{background:#fff1f0;color:#b42318;border-color:#ffd0cc}
.foot{text-align:right;font-size:12px;margin-top:22px}

@media(max-width:1180px){.sidebar{position:static;width:auto;margin:12px}
.main{margin-left:0;padding:0 12px 60px}
.bar{grid-template-columns:1fr 1fr}
.hero,.two,.three,.kpis{grid-template-columns:1fr}
.hero-side{grid-template-columns:1fr}
.intro{display:block}
.badge{display:inline-flex;margin-top:14px}
}


/* Homepage parity with the accepted dashboard logic. */
.home-filter-bar{grid-template-columns:minmax(260px,300px) minmax(220px,280px) minmax(420px,1fr) auto;align-items:stretch}
.search-field,.scope-field{align-self:start;min-height:46px;min-width:0}
.range-dock{position:relative;min-width:0;align-self:start}
.range-toolbar{position:relative;z-index:12}
.range-toolbar-main{display:grid;grid-template-columns:minmax(210px,250px) minmax(260px,1fr);gap:8px;align-items:stretch}
.range-button{width:100%;height:46px;min-height:46px;border:1px solid var(--line);border-radius:18px;background:#fffdf8;color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;padding:0 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
.range-button>span{font-size:11px;color:#9c9489;white-space:nowrap}
.range-button strong{display:block;font-size:13px;line-height:1.1;letter-spacing:-.02em}
.range-button small{display:none}
.range-preset-strip{min-height:46px;border:1px solid var(--line);border-radius:18px;background:#fffdf8;padding:5px;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:thin}
.range-preset-strip button{border:0;border-radius:999px;background:transparent;color:var(--muted);white-space:nowrap;padding:7px 9px;font-size:12px}
.range-preset-strip button:hover{background:#f1ebe2;color:var(--ink)}
.range-preset-strip button.active{background:var(--ink);color:#fff}
.range-popover{position:absolute;right:0;top:56px;width:min(760px,calc(100vw - 330px));border:1px solid var(--line);border-radius:24px;background:rgba(255,253,248,.98);box-shadow:0 28px 90px rgba(49,40,27,.18);padding:14px;z-index:30}
.calendar-input-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.calendar-input-card{border:1px solid var(--line);border-radius:16px;background:#f8f3eb;padding:8px 10px;display:grid;gap:4px}
.calendar-input-card span{font-size:11px;color:var(--muted)}
.calendar-input-card input{border:0;background:transparent;outline:0;font-weight:760;color:var(--ink)}
.range-calendar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.range-calendar-panel{border:1px solid var(--line);border-radius:18px;background:#fffdf8;padding:12px}
.calendar-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.calendar-panel-head h4{margin:2px 0 0;font-size:16px;letter-spacing:-.04em}
.calendar-nav{display:flex;gap:5px}
.calendar-nav button{width:30px;height:30px;border:1px solid var(--line);border-radius:10px;background:#f7f1e9;color:var(--ink)}
.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-week span{text-align:center;color:var(--muted);font-size:11px;padding:4px 0}
.calendar-day{height:34px;border:0;border-radius:11px;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.calendar-day.out{color:#b8afa4}
.calendar-day.in-range{background:#ede7ff;color:#42328f}
.calendar-day.start,.calendar-day.end{background:var(--ink);color:#fff}
.calendar-pick-note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.35}
.command-actions{align-self:start;min-height:46px;align-items:center}
.status-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:2px 0 14px}
.status-strip div{border:1px solid var(--line);border-radius:16px;background:rgba(255,253,248,.86);box-shadow:var(--shadow);padding:10px 11px;min-width:0}
.status-strip strong{display:block;color:#5f584e;font-size:11px;font-weight:760;margin-bottom:4px;white-space:nowrap}
.status-strip span{display:block;font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit-ok{color:#166534!important}.audit-warn{color:#9a6500!important}.audit-bad{color:#b42318!important}
.kpi-six{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.overview-matrix-card{position:relative;overflow:visible;border:1px solid rgba(222,215,204,.92);border-radius:24px;background:rgba(255,253,248,.94);box-shadow:var(--shadow);padding:16px;min-width:0;text-align:left;display:block}
.matrix-card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.matrix-card-head h4{margin:0;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.matrix-card-head .sub{margin:0;text-align:right;max-width:260px;line-height:1.32;font-size:11.5px;color:var(--muted)}
.help{display:inline-grid;place-items:center;flex:0 0 auto;width:18px;height:18px;border:1px solid rgba(189,178,162,.9);border-radius:999px;font-style:normal;font-size:11px;font-weight:850;color:#6f6256;background:#fffaf2;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);cursor:help}
.metric-matrix{display:grid;border:1px solid rgba(226,217,203,.95);border-radius:18px;overflow:hidden;background:#f7f1e8}
.metric-matrix.cols-1{grid-template-columns:minmax(70px,.8fr) minmax(120px,1.2fr)}
.metric-matrix.cols-2{grid-template-columns:minmax(70px,.7fr) repeat(2,minmax(120px,1fr))}
.metric-matrix.cols-3{grid-template-columns:minmax(70px,.68fr) minmax(108px,1.05fr) minmax(108px,1.05fr) minmax(92px,.82fr)}
.metric-matrix.cols-5{grid-template-columns:minmax(68px,.68fr) minmax(58px,.58fr) minmax(74px,.74fr) minmax(74px,.74fr) minmax(70px,.7fr) minmax(70px,.7fr)}
.metric-matrix.profit-matrix{grid-template-columns:minmax(70px,.62fr) minmax(112px,1fr) minmax(112px,1fr) minmax(112px,.92fr)}
.metric-matrix .matrix-cell{min-height:48px;padding:8px 9px;border-right:1px solid rgba(232,224,211,.86);border-bottom:1px solid rgba(232,224,211,.86);min-width:0;font-size:12px;line-height:1.18;background:transparent;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}
.metric-matrix.cols-1 .matrix-cell:nth-child(2n),.metric-matrix.cols-2 .matrix-cell:nth-child(3n),.metric-matrix.cols-3 .matrix-cell:nth-child(4n),.metric-matrix.cols-5 .matrix-cell:nth-child(6n){border-right:0}
.metric-matrix.cols-1 .matrix-cell:nth-last-child(-n+2),.metric-matrix.cols-2 .matrix-cell:nth-last-child(-n+3),.metric-matrix.cols-3 .matrix-cell:nth-last-child(-n+4),.metric-matrix.cols-5 .matrix-cell:nth-last-child(-n+6){border-bottom:0}

.metric-matrix .matrix-cell.head{min-height:38px;margin:0;gap:0;background:#f7f1e8;color:var(--muted);font-size:11.5px;font-weight:900;text-transform:none;letter-spacing:.02em}
.metric-matrix .matrix-cell.head:first-child{border-top-left-radius:17px}
.metric-matrix.cols-1 .matrix-cell.head:nth-child(2),.metric-matrix.cols-2 .matrix-cell.head:nth-child(3),.metric-matrix.cols-3 .matrix-cell.head:nth-child(4),.metric-matrix.cols-5 .matrix-cell.head:nth-child(6){border-top-right-radius:17px}
.metric-matrix .label{color:var(--ink);background:#fff9f0;font-size:14px;font-weight:880;letter-spacing:-.01em}
.metric-matrix .value{font-size:17px;font-weight:880;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.03em;word-break:break-word;background:#fffdf8}
.profit-matrix .matrix-cell.value{align-items:center;justify-content:center;text-align:center;font-size:17px}
.metric-matrix.cols-1 .matrix-cell.value{font-size:20px}
.metric-matrix.cols-5 .matrix-cell{min-height:44px;padding:7px 6px}
.metric-matrix.cols-5 .matrix-cell.label{font-size:13px}
.metric-matrix.cols-5 .matrix-cell.value{font-size:14.5px;letter-spacing:-.025em}
.metric-note{display:inline-block;font-size:12px;line-height:1.26;font-weight:760;color:var(--muted);letter-spacing:0}
.traffic-matrix .matrix-cell.value,.inventory-matrix .matrix-cell.value{font-size:16px}
.pending{color:#9a6500;font-weight:720}
.trend-toggle{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.trend-toggle button{border:1px solid var(--line);border-radius:999px;background:#fffdf8;color:var(--muted);min-height:34px;padding:0 12px}
.trend-toggle button.active{background:var(--ink);border-color:var(--ink);color:#fff}
.trend-stack{display:grid;grid-template-columns:1fr;gap:14px}
.trend-panel{padding:16px 18px 14px}

const TREND_METRICS={sales:{label:'成交额',money:true},quantity:{label:'销量'},returns:{label:'售后'},profit:{label:'利润',money:true},traffic:{label:'流量'},inventory:{label:'库存'}};
function trendMetricButtons(){return`<div class="trend-toggle">${Object.entries(TREND_METRICS).map(([k,m])=>`<button type="button" class="${S.trendMetric===k?'active':''}" data-trend-metric="${H(k)}">${H(m.label)}</button>`).join('')}</div>`}
function bucketLabel(id,kind){return kind==='month'?id:id}
function bucket(map,id,kind){const row=map.get(id)||{id,label:bucketLabel(id,kind)};map.set(id,row);return row}
function rowsFromMap(map){return Array.from(map.values()).sort((a,b)=>String(a.id).localeCompare(String(b.id)))}
function addTrend(map,kind,date,vals){if(!date)return;const id=kind==='month'?monthId(date):date;const r=bucket(map,id,kind);Object.entries(vals).forEach(([k,v])=>r[k]=N(r[k])+N(v))}
function buildTrendSeries(kind,metric=S.trendMetric){const map=new Map();if(metric==='sales'||metric==='quantity'){for(const r of sales()){const d=dt(r);addTrend(map,kind,d,metric==='sales'?{net:netSales(r),gross:grossSales(r)}:{net:netQty(r),gross:grossQty(r)})}return{series:rowsFromMap(map),lines:[{key:'net',label:metric==='sales'?'净成交额':'净销量',color:metric==='sales'?'#10b981':'#60a5fa'},{key:'gross',label:metric==='sales'?'总成交额':'总销量',color:metric==='sales'?'#f59e0b':'#a78bfa'}],note:'按当前店铺/负责人、货号和日期筛选重算。'}}
if(metric==='returns'){for(const r of orderCreatedReturns()){const d=returnDate(r,'order');addTrend(map,kind,d,{order:1})}for(const r of returns()){const d=returnDate(r,'request');addTrend(map,kind,d,{request:1})}return{series:rowsFromMap(map),lines:[{key:'request',label:'售后申请时间',color:'#ef4444'},{key:'order',label:'订单创建时间',color:'#f97316'}],note:'两条线都来自售后明细：申请时间看本期新申请售后，订单创建时间看本期创建订单后续发生的售后。'}}
if(metric==='profit'){for(const r of hprofit()){const d=dt(r);addTrend(map,kind,d,{loss:profitAmountLoss(r),rtv:profitAmountRtv(r)})}return{series:rowsFromMap(map),lines:[{key:'loss',label:'退货全损保守',color:'#14b8a6'},{key:'rtv',label:'RTV入仓测算',color:'#f97316'}],note:'含仓储真实利润；两条线与顶部利润卡同口径。'}}
if(metric==='traffic'){const tr=trafficSummary(false);for(const r of tr.rows){const d=dt(r);addTrend(map,kind,d,{eps:firstNum(r,['eps_uv','exposure_uv','exposure_cnt','impressions']),uv:firstNum(r,['goods_uv','uv','visitor_cnt','visitors']),sale:firstNum(r,['sale_cnt','pay_order_cnt','quantity'])})}return{series:rowsFromMap(map),lines:[{key:'eps',label:'曝光量',color:'#06b6d4'},{key:'uv',label:'访客量',color:'#3b82f6'},{key:'sale',label:'成交件数',color:'#8b5cf6'}],rangeText:tr.rangeText,note:(tr.effectiveShifted?`已按流量最新可用区间 ${tr.rangeText} 展示。`:'')+'绝对量同轴展示；点击率/支付率留在顶部流量卡。'}}
if(metric==='inventory'){const latestByMonth=new Map();for(const r of invTrendLoose()){const d=dt(r);if(!d)continue;const id=kind==='month'?monthId(d):d;const row=latestByMonth.get(id)||{id,label:id,date:''};if(!row.date||d>=row.date){row.date=d;row.usable=firstNum(r,['usable_inventory','platform_display_stock','available_qty']);row.total=firstNum(r,['inventory_quantity','total_inventory','platform_total_stock']);row.locked=firstNum(r,['order_locked_quantity','pay_locked_quantity','locked_inventory'])}latestByMonth.set(id,row)}return{series:rowsFromMap(latestByMonth),lines:[{key:'usable',label:'可售展示库存',color:'#14b8a6'},{key:'total',label:'总展示库存',color:'#60a5fa'},{key:'locked',label:'锁定库存',color:'#f59e0b'}],note:(kind==='month'?'月图取每月最新快照，不累加库存。':'来自前台展示库存每日快照。')}}
return{series:[],lines:[],note:''}}
function trendValueText(v,metric=S.trendMetric){const meta=TREND_METRICS[metric]||{};return meta.money?money(v):M(v)}
function niceCeil(v){const n=Math.abs(N(v));if(n<=10)return 10;const p=Math.pow(10,Math.floor(Math.log10(n)));return Math.ceil(n/p)*p}
function dataTip(v){return H(v).replace(/\n/g,'&#10;')}
function lineChart(kind,metric=S.trendMetric){
const built=buildTrendSeries(kind,metric),series=built.series||[],lines=built.lines||[];
const meta=TREND_METRICS[metric]||{};
if(!series.length||!lines.length)return`<div class="empty">当前时间段 ${H(selectedRangeText())} 暂无${H(meta.label||metric)}趋势数据。</div>`;
const keys=lines.map(x=>x.key),colors=Object.fromEntries(lines.map(x=>[x.key,x.color])),labels=Object.fromEntries(lines.map(x=>[x.key,x.label]));
const overlay=(metric==='sales'||metric==='quantity')&&keys.includes('net')&&keys.includes('gross');
const canOverlay=r=>{const net=N(r.net),gross=N(r.gross);return gross>=0&&net>=0&&net<=gross};
const vals=series.flatMap(r=>keys.map(k=>N(r[k])));
const maxRaw=Math.max(1,...vals),minRaw=Math.min(0,...vals);
const max=niceCeil(maxRaw),min=minRaw<0?-niceCeil(Math.abs(minRaw)):0,span=Math.max(1,max-min);
const w=1280,h=306,padL=72,padR=28,padT=28,padB=54,plotW=w-padL-padR,plotH=h-padT-padB;
const yFor=v=>padT+(1-((N(v)-min)/span))*plotH,zeroY=yFor(0);
const ticks=[min,min+span*.25,min+span*.5,min+span*.75,max];
const grid=ticks.map(v=>`<line class="grid-line" x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w-padR}" y2="${yFor(v).toFixed(1)}"></line><text class="axis" text-anchor="end" x="${padL-8}" y="${(yFor(v)+4).toFixed(1)}">${H(compact(v))}</text>`).join('');
const groupW=plotW/Math.max(1,series.length),dense=groupW<keys.length*7,innerGap=dense?0:4,groupInner=Math.max(1,groupW*(dense?0.88:0.72));
const groupedBarW=Math.max(dense?0.9:2,Math.min(28,(groupInner-innerGap*(keys.length-1))/Math.max(1,keys.length)));
const overlayTotalW=Math.max(dense?1.2:3,Math.min(34,groupW*(dense?0.74:0.52)));
const overlayNetW=Math.max(dense?0.85:2,overlayTotalW*.56);
const groupX=i=>padL+i*groupW+groupW/2;
const groupedBarX=(i,ki)=>groupX(i)-(groupedBarW*keys.length+innerGap*(keys.length-1))/2+ki*(groupedBarW+innerGap);
const gid=k=>`trend-${kind}-${metric}-${k}`.replace(/[^a-z0-9_-]/gi,'-');
const defs=`<defs>${lines.map(l=>`<linearGradient id="${H(gid(l.key))}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${H(l.color)}" stop-opacity=".96"></stop><stop offset="1" stop-color="${H(l.color)}" stop-opacity=".48"></stop></linearGradient>`).join('')}</defs>`;
const rectFor=(klass,x,width,v,fill,tip)=>{const y=yFor(v),top=Math.min(y,zeroY),height=Math.abs(zeroY-y),rx=Math.min(6,Math.max(1,width/2));return`<rect class="trend-bar ${klass}" data-tip="${tip}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${width.toFixed(1)}" height="${height.toFixed(1)}" rx="${rx.toFixed(1)}" fill="${fill}"></rect>`};
const overlayDetail=r=>{const gross=N(r.gross),net=N(r.net),diff=gross-net;return`${labels.gross}：${trendValueText(gross,metric)}\n${labels.net}：${trendValueText(net,metric)}\n反转/扣减：${trendValueText(diff,metric)}${canOverlay(r)?'':'\n口径关系异常，已并列显示'}`};
const bars=overlay?series.map((r,i)=>{const tip=dataTip(r.label+'\n'+overlayDetail(r));if(canOverlay(r)){const cx=groupX(i),gross=N(r.gross),net=N(r.net);return rectFor('trend-bar-total',cx-overlayTotalW/2,overlayTotalW,gross,`url(#${H(gid('gross'))})`,tip)+rectFor('trend-bar-net',cx-overlayNetW/2,overlayNetW,net,`url(#${H(gid('net'))})`,tip)}return keys.map((k,ki)=>rectFor('trend-bar-fallback',groupedBarX(i,ki),groupedBarW,N(r[k]),`url(#${H(gid(k))})`,tip)).join('')}).join(''):keys.map((k,ki)=>series.map((r,i)=>{const tip=dataTip(labels[k]+' · '+r.label+'\n'+trendValueText(r[k],metric));return rectFor('',groupedBarX(i,ki),groupedBarW,N(r[k]),`url(#${H(gid(k))})`,tip)}).join('')).join('');
const every=series.length<=7?1:Math.ceil(series.length/(kind==='month'?7:6));
const valueLabels=overlay?series.map((r,i)=>{if(!(i===0||i===series.length-1||i%every===0))return'';const v=N(r.net);if(!v&&i!==0&&i!==series.length-1)return'';const x=groupX(i),y=yFor(v),anchor=i===0?'start':i===series.length-1?'end':'middle';return`<text class="value-label bar-value-label" text-anchor="${anchor}" x="${x.toFixed(1)}" y="${Math.max(14,y-7).toFixed(1)}" fill="${colors.net}">${H(compact(v))}</text>`}).join(''):keys.map((k,ki)=>series.map((r,i)=>{if(!(i===0||i===series.length-1||i%every===0))return'';const v=N(r[k]);if(!v&&i!==0&&i!==series.length-1)return'';const x=groupedBarX(i,ki)+groupedBarW/2,y=yFor(v),positive=v>=0,ty=positive?Math.max(14,y-7-ki*12):Math.min(h-padB+20,y+14+ki*12);const anchor=i===0?'start':i===series.length-1?'end':'middle';return`<text class="value-label bar-value-label" text-anchor="${anchor}" x="${x.toFixed(1)}" y="${ty.toFixed(1)}" fill="${colors[k]}">${H(compact(v))}</text>`}).join('')).join('');
const hitW=Math.max(10,Math.min(120,groupW*.92));
const hits=series.map((r,i)=>{const x=Math.max(padL,Math.min(w-padR-hitW,groupX(i)-hitW/2));const detail=overlay?overlayDetail(r):keys.map(k=>labels[k]+'：'+trendValueText(r[k],metric)).join('\n');const tip=dataTip(r.label+'\n'+detail);return`<rect class="chart-hit" data-tip="${tip}" x="${x.toFixed(1)}" y="${padT}" width="${hitW.toFixed(1)}" height="${plotH}"></rect>`}).join('');
const axisEvery=Math.ceil(series.length/6);
const axis=series.map((r,i)=>(series.length<=8||i===0||i===series.length-1||i%axisEvery===0)?`<text class="axis" text-anchor="${i===0?'start':i===series.length-1?'end':'middle'}" x="${groupX(i).toFixed(1)}" y="${h-10}">${H(r.label)}</text>`:'').join('');
const latest=series.at(-1)||{};
const legend=overlay?`<span class="legend-net"><i style="--c:${colors.net}"></i>${H(labels.net)}：${H(trendValueText(latest.net||0,metric))}</span><span class="legend-total"><i style="--c:${colors.gross}"></i>${H(labels.gross)}：${H(trendValueText(latest.gross||0,metric))}</span><span class="legend-diff"><i style="--c:#9b8b77"></i>反转/扣减：${H(trendValueText(N(latest.gross)-N(latest.net),metric))}</span>`:keys.map(k=>`<span><i style="--c:${colors[k]}"></i>${H(labels[k])}：${H(trendValueText(latest[k]||0,metric))}</span>`).join('');
return`<div class="line-chart bar-chart${overlay?' overlay-bar-chart':''}"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${H((kind==='month'?'月':'日')+(meta.label||metric)+'柱状趋势')}">${defs}<rect class="plot-band" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" rx="14"></rect>${grid}<line class="axis-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}"></line><line class="axis-line" x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}"></line><line class="zero-line" x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}"></line>${bars}${valueLabels}${axis}${hits}</svg><div class="chart-legend">${legend}</div><p class="sub">时间段：${H(built.rangeText||`${S.start} 至 ${S.end}`)}；当前显示 ${M(series.length)} 个${kind==='month'?'月份':'日期'}。${H(built.note||'')}</p></div>`}
function trendPanel(kind){const metric=S.trendMetric;const needed=metric==='profit'?(String(S.q||'').trim()?'profit':'homeProfit'):metric==='traffic'?'productTrafficDaily':metric==='inventory'?'inventoryTrend':'homeRankings';const built=buildTrendSeries(kind,metric);if(sourceLoading(needed,built.series))return`<section class="panel trend-panel"><h4>${kind==='month'?'月趋势':'日趋势'} · ${H(TREND_METRICS[metric]?.label||metric)}</h4><p class="sub">${H(SL[needed]||needed)} 加载中</p><div class="empty">正在加载${H(SL[needed]||needed)}，加载完成后自动刷新本图。</div></section>`;return`<section class="panel trend-panel"><h4>${kind==='month'?'月趋势':'日趋势'} · ${H(TREND_METRICS[metric]?.label||metric)}</h4><p class="sub">${H(metric==='inventory'?inventoryScopeNote():homeScopeSubtitle())}</p>${lineChart(kind,metric)}</section>`}

function isCodOrder(r){if(r?.is_cod===true||r?.is_cod===1||String(r?.is_cod).toLowerCase()==='true')return true;const txt=[r?.payment_label,r?.payment_method,r?.tags].map(x=>String(x||'').toUpperCase()).join(' ');if(/NON[_ -]?COD/.test(txt))return false;return /(^|[^A-Z0-9])COD($|[^A-Z0-9])/.test(txt)}

function staleShipAge(r){const d=ISO(r?.created_date||r?.order_create_time);if(!d)return false;const t=new Date(`${d}T00:00:00+08:00`).getTime();return Number.isFinite(t)&&Date.now()-t>10*86400_000}
function orderStatusKey(r){const g=String(r?.order_status_group||'').trim();if(g&&g!=='cod')return g;const s=orderStatusText(r),w=String(r?.waybill_status||r?.tag_desc||'');if(/未妥投|退回|拒收/.test(s+w))return'returning';if(/异常|失败|超时|风控|拦截/.test(s+w))return'abnormal';if(/取消|关闭/.test(s))return'cancelled';if(/已签收|已完成|妥投/.test(s))return'done';if(/尾程已发货|已发货|运输|揽收|包裹已揽收/.test(s+w))return staleShipAge(r)?'pending_recheck':'shipped';if(/待处理|待发货|待揽收|待出库|待|下单成功|已打印面单/.test(s+w))return staleShipAge(r)?'pending_recheck':'pending';return'other'}
function orderStatusMatch(r,key){if(key==='all')return true;if(key==='cod')return isCodOrder(r);if(key==='abnormal')return orderStatusKey(r)==='abnormal'||/失败|异常|超时/.test(orderStatusText(r)+String(r?.waybill_status||r?.tag_desc||''));return orderStatusKey(r)===key}
function orderStatusBadge(r){const k=orderStatusKey(r),raw=orderStatusText(r)||'未知';const label=k==='platform_unclosed'?'平台未闭环':k==='pending_recheck'?'待复查':k==='mixed'?'混合状态':raw;return`<span class="order-status ${H(k)}" title="${H(raw)}">${H(label)}</span>`}
function paymentBadge(r){return isCodOrder(r)?'<span class="cod-badge">COD</span>':''}
function normalizedOrderText(x){return String(x||'').replace(/[\s_\-·：:]/g,'').toUpperCase()}
function paymentDetailText(r){const raw=String(r?.payment_label||r?.payment_method||'').trim();const n=normalizedOrderText(raw);if(!raw||n==='COD'||n==='NONCOD')return'';return raw}
function orderPaymentHtml(r){const parts=[paymentBadge(r),paymentDetailText(r)?H(paymentDetailText(r)):'' ].filter(Boolean);return parts.join(' ')}
function orderStatusMetaText(r){if(r?.order_status_source==='recheck'){const n=N(r?.status_check_count)||1;return `复查 ${M(n)} 次 · ${fmtStamp(r?.status_checked_at||r?.updated_at)}`;}return `销售源 · ${fmtStamp(r?.updated_at)}`}

function orderItems(r){return A(r?.items)}
function orderProductMainText(r){if(N(r?.item_count)>1||N(r?.product_count)>1)return String(r?.product_summary||'多商品订单');return prod(r)}
function orderProductSubText(r){const its=orderItems(r);if(its.length>1){const details=String(r?.product_detail_summary||'').trim()||its.slice(0,5).map(it=>[it?.standard_goods_sn,it?.skc,it?.goods_title].filter(Boolean).join(' · ')).filter(Boolean).join('；');const extra=its.length>5?`；+${M(its.length-5)}项`:'';return details+extra}const main=String(prod(r)||'').trim();const nm=normalizedOrderText(main);const vals=[pkey(r),r?.skc,r?.sku,r?.goods_title].map(x=>String(x||'').trim()).filter(Boolean);for(const v of vals){if(normalizedOrderText(v)&&normalizedOrderText(v)!==nm)return v}return''}
function primaryExpressText(r){return String(r?.express_code||r?.express_no||'').trim()}
function secondaryExpressText(r){const a=String(r?.express_code||'').trim(),b=String(r?.express_no||'').trim();return a&&b&&a!==b?b:''}
function etShipperText(r){const code=String(r?.et_shipper_code||'').trim().toUpperCase();const name=String(r?.et_shipper_name||'').trim();if(name)return name;if(code)return code;return'无'}
function etOutboundMeta(r){const parts=[];if(r?.et_outbound_status)parts.push(String(r.et_outbound_status));if(r?.et_outbound_time)parts.push(shortDate(r.et_outbound_time));else if(r?.et_outbound_create_time)parts.push(shortDate(r.et_outbound_create_time));if(r?.et_logistics_title)parts.push(String(r.et_logistics_title));return parts.join(' · ')}
function etOutboundHtml(r){const id=String(r?.et_outbound_id||'').trim();if(!id)return'<small>ET 未关联</small>';const meta=etOutboundMeta(r);const raw=String(r?.et_detail_url||'').trim();const url=raw||`${ET_OUTBOUND_DETAIL_BASE}?oId=${encodeURIComponent(id)}`;const idHtml=`<a class="mono et-link" href="${H(url)}" target="_blank" rel="noreferrer">${H(id)}</a>`;return`<small><span class="et-label">ET</span> ${idHtml}${meta?` · ${H(meta)}`:''}</small>`}
function packageText(r){return secondaryExpressText(r)||String(r?.place_order_package_id||'').trim()}
function statusDistributionText(r){const d=r?.status_distribution;if(!d||typeof d!=='object')return'';const names={abnormal:'异常',returning:'未妥投退回',platform_unclosed:'平台未闭环',pending_recheck:'待复查',pending:'待处理',shipped:'运输中',done:'已签收',cancelled:'取消',mixed:'混合',other:'其他'};return Object.entries(d).map(([k,v])=>`${names[k]||k} ${M(v)}`).join(' / ')}
function orderTimelineTip(r){const lines=[];if(N(r?.item_count)>1)lines.push(`商品：${String(r?.product_summary||'多商品订单')}（${String(r?.product_detail_summary||'').slice(0,180)}）`);const sd=statusDistributionText(r);if(sd)lines.push(`商品状态：${sd}`);lines.push(`订单创建：${fmtStamp(r?.order_create_time||r?.created_date)}`);if(r?.updated_at)lines.push(`状态更新：${fmtStamp(r.updated_at)}`);if(r?.status_checked_at)lines.push(`订单复查：第 ${M(N(r?.status_check_count)||1)} 次 · ${fmtStamp(r.status_checked_at)}`);if(r?.print_time)lines.push(`打单：${fmtStamp(r.print_time)}`);if(r?.collect_time)lines.push(`揽收：${fmtStamp(r.collect_time)}`);const ws=[r?.waybill_status,r?.tag_desc].filter(Boolean).join(' · ');if(ws)lines.push(`包裹状态：${ws}`);const etMeta=etOutboundMeta(r);if(etMeta)lines.push(`ET状态：${etMeta}`);if(r?.et_shipper_code||r?.et_shipper_name)lines.push(`发货人：${etShipperText(r)}`);if(N(r?.waybill_count)>1)lines.push(`包裹数：${M(r.waybill_count)}（当前展示最新一条物流）`);if(orderStatusKey(r)==='platform_unclosed')lines.push('提示：该单已重新向 SHEIN 查询，但平台当前仍返回非终态；不按真实运输中统计，并会继续复查。');if(orderStatusKey(r)==='pending_recheck')lines.push('提示：该单超过10天仍非终态，正在等待后台复查任务刷新。');if(/已签收/.test(orderStatusText(r))&&!r?.signed_time)lines.push('签收：当前订单状态为已签收（暂无精确签收时间）');if(!(r?.express_no||r?.express_code))lines.push('物流：暂无云端精确物流单号');if(!r?.et_outbound_id)lines.push('ET出库：未关联到 ET 出库单');return lines.join('\n')}
function orderStatusTabs(rows){const counts=new Map(ORDER_STATUS_FILTERS.map(([k])=>[k,uniqueOrderCount(k==='all'?rows:rows.filter(r=>orderStatusMatch(r,k)))]));return`<div class="status-tabs">${ORDER_STATUS_FILTERS.map(([k,label])=>`<button class="status-filter ${S.orderStatus===k?'active':''}" data-order-status="${H(k)}"><span>${H(label)}</span><b>${M(counts.get(k)||0)}</b></button>`).join('')}</div>`}
function orderPager(page,total,totalRows,pageSize){const prev=Math.max(1,page-1),next=Math.min(total,page+1);const sizes=[50,80,150,300];return`<div class="pager"><button class="btn" data-order-page="1" ${page<=1?'disabled':''}>首页</button><button class="btn" data-order-page="${prev}" ${page<=1?'disabled':''}>上一页</button><span>第 <input class="page-input" data-order-page-input type="number" min="1" max="${H(total)}" value="${H(page)}"> / <b>${M(total)}</b> 页</span><button class="btn" data-order-page="${next}" ${page>=total?'disabled':''}>下一页</button><button class="btn" data-order-page="${total}" ${page>=total?'disabled':''}>末页</button><label>每页 <select data-order-page-size>${sizes.map(n=>`<option value="${n}" ${Number(pageSize)===n?'selected':''}>${n}</option>`).join('')}</select> 条</label><span>共 ${M(totalRows)} 单</span></div>`}
function orderTable(rows){return`<div class="table-wrap order-table-wrap"><table class="order-table"><colgroup><col class="c-time"><col class="c-store"><col class="c-order"><col class="c-product"><col class="c-num"><col class="c-num"><col class="c-status"><col class="c-shipper"><col class="c-waybill"></colgroup><thead><tr><th>订单时间</th><th>店铺</th><th>订单</th><th>货号 / 商品</th><th class="num">金额</th><th class="num">件数</th><th>状态</th><th>发货人</th><th>物流 / ET出库</th></tr></thead><tbody>${rows.map(r=>{const tip=dataTip(orderTimelineTip(r));const express=primaryExpressText(r)||'—';const pkg=packageText(r);const wayStatus=[r.waybill_status,r.tag_desc].filter(Boolean).join(' · ');const multi=N(r.waybill_count)>1?`<em class="multi-waybill">多包裹 ${M(r.waybill_count)}</em>`:'';const pkgMeta=[pkg?`包裹号 ${pkg}`:'',wayStatus].filter(Boolean).join(' · ');return`<tr><td><b>${H(shortDate(r.order_create_time||r.created_date))}</b><small>${H(fmtStamp(r.order_create_time).replace(/^.*? /,''))}</small></td><td>${H(storeDisplayName(sk(r)))}</td><td><b class="mono">${H(r.order_no||r.bill_no||'—')}</b>${orderPaymentHtml(r)?`<small>${orderPaymentHtml(r)}</small>`:''}</td><td><b>${H(orderProductMainText(r))}</b>${orderProductSubText(r)?`<small class="product-detail" title="${H(orderProductSubText(r))}">${H(orderProductSubText(r))}</small>`:''}</td><td class="num"><b>${M2(r.sales_sar)}</b><small>SAR</small></td><td class="num"><b>${M(r.quantity)}</b><small>件</small></td><td>${orderStatusBadge(r)}<small>${H(orderStatusMetaText(r))}</small></td><td><b class="shipper-code">${H(etShipperText(r))}</b></td><td data-tip="${tip}"><b class="mono">${H(express)}</b>${etOutboundHtml(r)}${pkgMeta?`<small>${multi}${H(pkgMeta)}</small>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function ordersPage(){ensure('orders',true);if(!A(D.orders).length&&SS.orders?.status!=='ok')return intro('订单中心','按订单创建时间查看成交、取消、履约、COD 和物流状态。')+wait('orders');
const base=orders().slice().sort((a,b)=>String(b.order_create_time||dt(b)).localeCompare(String(a.order_create_time||dt(a))));const active=base.filter(r=>orderStatusMatch(r,S.orderStatus||'all'));const pageSize=Math.max(20,Math.min(500,Number(S.orderPageSize)||80)),totalPages=Math.max(1,Math.ceil(active.length/pageSize));S.orderPage=Math.min(Math.max(1,Number(S.orderPage)||1),totalPages);const start=(S.orderPage-1)*pageSize,rs=active.slice(start,start+pageSize);const maxUpdated=base.map(r=>r.updated_at).filter(Boolean).sort().at(-1)||genAt();const codOrders=uniqueOrderCount(base.filter(isCodOrder)),waybillOrders=uniqueOrderCount(base.filter(r=>r.express_no||r.express_code));return intro('订单中心','以订单创建时间为主口径；销售金额来自销售事实，订单状态优先使用后台复查层并持续追到终态。')+`<section class="kpis orders-kpis"><div class="stat"><div class="stat-label">订单数</div><div class="stat-value">${M(uniqueOrderCount(base))}</div><div class="stat-note">当前筛选去重订单</div></div><div class="stat"><div class="stat-label">销售额</div><div class="stat-value">${M2(sum(base,['sales_sar']))}</div><div class="stat-note">SAR · 订单聚合金额</div></div><div class="stat"><div class="stat-label">COD 订单</div><div class="stat-value">${M(codOrders)}</div><div class="stat-note">来自 payment flag</div></div><div class="stat"><div class="stat-label">已关联物流</div><div class="stat-value">${M(waybillOrders)}</div><div class="stat-note">store + order_no 精确关联</div></div></section>${head('订单状态筛选',`按当前订单/履约字段自动归类；超过10天仍非终态的订单会进入后台复查，复查后仍未终态显示“平台未闭环”，并继续追踪。最近状态更新时间：${fmtStamp(maxUpdated)}。`,chips(['orders']))}<section class="panel order-center-panel">${orderStatusTabs(base)}${orderPager(S.orderPage,totalPages,active.length,pageSize)}${rs.length?orderTable(rs):'<div class="empty">当前状态筛选没有订单。</div>'}${orderPager(S.orderPage,totalPages,active.length,pageSize)}<p class="foot">一行一个 SHEIN 订单；多商品订单已在货号列汇总，搜索仍覆盖订单内所有货号 / SKC / 商品名。</p></section>`}

const RETURN_STATUS_FILTERS=[['all','全部'],['open','未闭环'],['waiting_buyer','待买家退货'],['in_transit','退货物流中'],['platform_pending','平台/仓库'],['settled','已落定'],['cancelled','已取消'],['cod','COD'],['quality','质量问题']];
const RETURN_RTV_FILTERS=[['all','全部RTV'],['received_resellable','已回仓可售'],['received_loss','已回仓损失'],['received_pending','已回仓待判'],['received_unknown','已回仓未知'],['not_received','未匹配回仓'],['not_applicable','无需退货包裹']];
function returnCaseId(r){return [sk(r),r?.aftersales_order_no||r?.return_order_no||r?.order_no||r?.skc||pkey(r),r?.request_time||dt(r)].join('|')}
function returnAmount(r){return firstNum(r,['amount_sar','price_amount_total','refund_amount_sar'])}
function returnQty(r){return firstNum(r,['quantity','return_quantity'])||1}
function returnStatusKey(r){return String(r?.status_group||'open').trim()||'open'}
function returnReasonGroup(r){return String(r?.reason_group||r?.reason_names||r?.reason||'未标注').trim()||'未标注'}
function returnReasonTitle(r){return String(r?.reason_names||r?.reason||r?.resolution_plan_name||r?.reason_group||'未标注').trim()||'未标注'}
function returnReasonSimilar(a,b){const x=String(a||'').trim(),y=String(b||'').trim();if(!x||!y)return false;if(x===y||x.includes(y)||y.includes(x))return true;const norm=v=>String(v||'').replace(/商品|原因|问题|售后|退货|退款|类/g,'').trim();const nx=norm(x),ny=norm(y);return !!(nx&&ny&&(nx===ny||nx.includes(ny)||ny.includes(nx)))}
function returnReasonSub(r){const title=returnReasonTitle(r);const parts=[];const group=String(r?.reason_group||'').trim(),plan=String(r?.resolution_plan_name||'').trim();if(group&&!returnReasonSimilar(group,title))parts.push(group);if(plan&&!returnReasonSimilar(plan,title)&&!/^(退货退款|退款|仅退款)$/i.test(plan)&&!parts.some(x=>returnReasonSimilar(x,plan)))parts.push(plan);return parts.join(' · ')}
function returnRtvKey(r){return String(r?.rtv_group||'not_applicable').trim()||'not_applicable'}
function returnStatusLabel(r){return String(r?.status_group_label||RETURN_STATUS_FILTERS.find(x=>x[0]===returnStatusKey(r))?.[1]||'未落定')}
function returnRtvLabel(k){return ({received_resellable:'已回仓可售',received_loss:'已回仓损失',received_pending:'已回仓待判',received_unknown:'已回仓未知',not_received:'未匹配回仓',not_applicable:'无需退货包裹'}[k]||k||'—')}
function isCodReturn(r){if(r?.is_cod===true||r?.is_cod===1||String(r?.is_cod).toLowerCase()==='true')return true;const txt=[r?.payment_label,r?.payment_method,r?.reason_names,r?.reason_group].map(x=>String(x||'').toUpperCase()).join(' ');if(/NON[_ -]?COD/.test(txt))return false;return /(^|[^A-Z0-9])COD($|[^A-Z0-9])|货到付款/.test(txt)}
function isOpenReturn(r){return r?.is_open||!['settled','cancelled'].includes(returnStatusKey(r))}
function returnCounts(rows){return{cases:uniq(rows.map(returnCaseId)).length,amount:rows.reduce((a,r)=>a+returnAmount(r),0),qty:rows.reduce((a,r)=>a+returnQty(r),0),products:uniq(rows.map(pkey)).length,cod:uniq(rows.filter(isCodReturn).map(returnCaseId)).length,open:uniq(rows.filter(isOpenReturn).map(returnCaseId)).length,rtvReceived:uniq(rows.filter(r=>String(returnRtvKey(r)).startsWith('received')).map(returnCaseId)).length}}
function returnRateDenominator(sp){return S.returnStatus==='cod'?sp.cod:sp.all}
function returnRateDenominatorLabel(){return S.returnStatus==='cod'?'COD订单':'全部订单'}
function returnStatusBadge(r){const k=returnStatusKey(r);const cls=k==='settled'?'done':k==='cancelled'?'cancelled':k==='waiting_buyer'?'pending':k==='in_transit'?'shipped':k==='platform_pending'?'pending_recheck':'other';return`<span class="order-status ${H(cls)}">${H(returnStatusLabel(r))}</span>`}
function rtvBadge(r){const k=returnRtvKey(r);const cls=k==='received_resellable'?'done':k==='received_loss'?'abnormal':k==='received_pending'||k==='received_unknown'?'pending':k==='not_received'?'platform_unclosed':'other';return`<span class="order-status ${H(cls)}">${H(returnRtvLabel(k))}</span>`}
function returnFilterMatchFor(r,status=S.returnStatus,reason=S.returnReason,rtv=S.returnRtv){if(status==='cod'&&!isCodReturn(r))return false;if(status==='quality'&&!/质量/.test(returnReasonGroup(r)))return false;if(status==='open'&&!isOpenReturn(r))return false;if(!['all','cod','quality','open'].includes(status)&&returnStatusKey(r)!==status)return false;if(reason&&reason!=='all'&&returnReasonGroup(r)!==reason)return false;if(rtv&&rtv!=='all'&&returnRtvKey(r)!==rtv)return false;return true}
function returnFilterMatch(r){return returnFilterMatchFor(r)}
function returnTrend(rows,mode='request'){const m=new Map();for(const r of rows){const d=returnDate(r,mode);if(!d)continue;const row=m.get(d)||{date:d,value:0,cases:0,qty:0,open:0,cod:0};row.value+=returnAmount(r);row.cases+=1;row.qty+=returnQty(r);if(isOpenReturn(r))row.open+=1;if(isCodReturn(r))row.cod+=1;m.set(d,row)}return Array.from(m.values()).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({...r,label:r.date}))}
function returnReasonOptions(rows){return Array.from(new Set(rows.map(returnReasonGroup).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'))}
function returnStatusTabs(rows){const counts=new Map(RETURN_STATUS_FILTERS.map(([k])=>[k,0]));for(const [k] of RETURN_STATUS_FILTERS){counts.set(k,rows.filter(r=>returnFilterMatchFor(r,k,S.returnReason,S.returnRtv)).length)}return`<div class="status-tabs returns-tabs">${RETURN_STATUS_FILTERS.map(([k,label])=>`<button class="status-filter ${S.returnStatus===k?'active':''}" data-return-status="${H(k)}"><span>${H(label)}</span><b>${M(counts.get(k)||0)}</b></button>`).join('')}</div>`}
function returnPager(page,total,totalRows,pageSize){const prev=Math.max(1,page-1),next=Math.min(total,page+1);const sizes=[50,80,150,300];return`<div class="pager"><button class="btn" data-return-page="1" ${page<=1?'disabled':''}>首页</button><button class="btn" data-return-page="${prev}" ${page<=1?'disabled':''}>上一页</button><span>第 <input class="page-input" data-return-page-input type="number" min="1" max="${H(total)}" value="${H(page)}"> / <b>${M(total)}</b> 页</span><button class="btn" data-return-page="${next}" ${page>=total?'disabled':''}>下一页</button><button class="btn" data-return-page="${total}" ${page>=total?'disabled':''}>末页</button><label>每页 <select data-return-page-size>${sizes.map(n=>`<option value="${n}" ${Number(pageSize)===n?'selected':''}>${n}</option>`).join('')}</select> 条</label><span>共 ${M(totalRows)} 条售后</span></div>`}

function systemPage(){const secs=Object.keys(SL),staleCount=secs.filter(sectionNeedsAttention).length;const loadingCount=secs.filter(n=>(SS[n]||{}).status==='loading'||(SS[n]||{}).refreshing).length;const errorCount=secs.filter(n=>(SS[n]||{}).status==='error'||(SS[n]||{}).refreshError).length;const rows=secs.map(n=>{const st=SS[n]||{},state=st.refreshing?'刷新中':st.stale?'缓存兜底':st.status==='ok'?'已就绪':st.status==='error'?'失败':st.status==='loading'?'加载中':'本浏览器尚未请求';return[n,SL[n]||n,state,fmtStamp(st.generatedAt),fmtStamp(st.cachedAt),fmtStamp(st.coreGeneratedAt||sectionExpectedAt()),st.refreshError||st.error||'']});return intro('系统健康','展示云端运行态、section 加载状态、数据新鲜度和登录维护入口；缓存兜底会明确标黄，不会静默冒充最新。')+`<section class="grid three"><div class="stat"><div class="stat-label">Core generatedAt</div><div class="stat-value" style="font-size:18px">${H(genAt()||'—')}</div><div class="stat-note">来自云端运行态 core</div></div><div class="stat"><div class="stat-label">加载中 / 异常</div><div class="stat-value">${M(loadingCount)} / ${M(errorCount)}</div><div class="stat-note">失败会在对应页面直接提示</div></div><div class="stat"><div class="stat-label">缓存兜底/刷新中</div><div class="stat-value">${M(staleCount)}</div><div class="stat-note">有缓存兜底时不要当最新结论</div></div></section><section class="grid two login-maintenance-grid"><div class="panel"><h4>登录维护</h4><p class="sub">入口收在系统健康里。店铺登录态异常、验证码或协议弹窗时，从这里打开云端临时浏览器；登录完成后回维护中心点完成关闭。</p><div class="login-actions"><a class="btn primary" href="/cloud-login-maintenance" target="_blank" rel="noreferrer">打开登录维护中心</a><button class="btn" data-login-refresh="1">刷新临时窗口状态</button></div><p class="foot">协议签署/通知弹窗可以在云端窗口里直接点掉再登录；系统只导出登录态，不保存密码。</p></div><div class="panel"><h4>当前临时登录窗口</h4><p class="sub">只显示仍在启动或活动中的维护窗口，历史关闭窗口默认隐藏。</p><div id="loginSessionBox" class="login-session-box"><span class="pending">点击“刷新临时窗口状态”读取。</span></div></div></section><section class="panel"><h4>数据新鲜度边界</h4><p class="sub">这个表告诉你当前浏览器会话里每个 section 是最新、刷新中，还是旧缓存；“本浏览器尚未请求”不代表云端缺数据，只是你还没打开对应页面。只要显示“缓存兜底”，业务判断就要等刷新完成或手动强制刷新。</p>${chips(secs)}${table(['Key','名称','状态','Section时间','缓存写入','Core时间','错误'],rows)}<p class="foot">数据判断只认云端运行态；页面为了不卡可以先展示旧 section，但一定会在这里和页面顶部标出来。按需加载页面不会提前把所有 section 打开，避免一进站就把服务器打满。</p></section>`}

function shell(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'active':''}" data-tab="${t[0]}"><span>${t[1]}</span><small>${t[2]}</small></button>`).join('');$('scope').innerHTML=`<option value="ALL">全部店铺</option>`+owners.map(g=>`<option value="OWNER:${H(g.key)}">${H(ownerOptionLabel(g))}</option>`).join('')+stores.map(s=>`<option value="${H(s)}">${H(s)} · ${H(smeta.get(s)?.companyName||'')}</option>`).join('');sync(false);const rd=$('rangeDock');if(rd)rd.innerHTML=rangeControl();$('crumb').textContent=`${(TABS.find(t=>t[0]===S.tab)||TABS[0])[1]} · ${scopeName()} · ${selectedRangeText()}`;renderAccountBox();const ss=$('sideStatus');if(ss)ss.innerHTML=sideStatusHtml()}

async function sendOpsChat(askOnly=false){const input=$('opsChatInput');const text=String(input?.value||S.opsChatInput||'').trim();if(!text)return;S.opsChatInput=text;S.opsSending=true;render();try{const sessionId=S.opsActiveSessionId==='__new__'?'':(S.opsActiveSessionId||'');const body={message:text,sessionId,askAgent:true,noAutoTask:!!askOnly};const j=await opsApi('/api/link-ops-chats',{method:'POST',body:JSON.stringify(body)});OPS.chats=j.data||OPS.chats;OPS.tasks=j.taskData||OPS.tasks;if(j.session?.id)S.opsActiveSessionId=String(j.session.id);S.opsChatInput='';await loadOpsRuntime(true)}catch(e){OPS.error=e?.message||String(e);render()}finally{S.opsSending=false;render()}}
function opsConfirmText(id){return String([...document.querySelectorAll('[data-ops-confirm-input]')].find(x=>String(x.dataset.opsConfirmInput||'')===String(id||''))?.value||'').trim()}
async function loadOpsAudit(id){const taskId=String(id||'').trim();if(!taskId)return;OPS.loading=true;OPS.error='';render();try{const j=await opsApi(`/api/link-ops-audit?taskId=${encodeURIComponent(taskId)}&limit=20`);OPS.audit={...(OPS.audit||{}),[taskId]:{entries:A(j.entries),loadedAt:new Date().toISOString()}}}catch(e){OPS.error=e?.message||String(e)}finally{OPS.loading=false;render()}}
async function executeOpsTask(id,mode='dry-run',confirmText=''){const taskId=String(id||'').trim();if(!taskId)return;OPS.loading=true;OPS.error='';render();try{await opsApi('/api/link-ops-execute',{method:'POST',body:JSON.stringify({id:taskId,mode,confirm:confirmText})});await loadOpsRuntime(true);await loadOpsAudit(taskId)}catch(e){OPS.error=e?.message||String(e);render()}finally{OPS.loading=false;render()}}
async function resolveOpsTask(id,status='done'){const taskId=String(id||'').trim();if(!taskId)return;const note=window.prompt(status==='done'?'请填写核销说明：为什么确认这个任务已经完成？':'请填写归档说明：为什么归档这个任务？','人工确认已在 SHEIN 侧闭环');if(note===null)return;const finalNote=String(note||'').trim();if(!finalNote){OPS.error='人工核销必须填写说明';render();return}OPS.loading=true;OPS.error='';render();try{await opsApi('/api/link-ops-tasks',{method:'PATCH',body:JSON.stringify({id:taskId,status,note:finalNote,event:'manual_lifecycle_resolve_web'})});await loadOpsRuntime(true);await loadOpsAudit(taskId)}catch(e){OPS.error=e?.message||String(e);render()}finally{OPS.loading=false;render()}}
async function deleteOpsSession(id){const sessionId=String(id||'').trim();if(!sessionId)return;if(!window.confirm('删除这个运营会话？任务池任务不会删除。'))return;OPS.loading=true;OPS.error='';render();try{await opsApi(`/api/link-ops-chats?id=${encodeURIComponent(sessionId)}`,{method:'DELETE'});if(String(S.opsActiveSessionId||'')===sessionId)S.opsActiveSessionId='__new__';await loadOpsRuntime(true)}catch(e){OPS.error=e?.message||String(e);render()}finally{OPS.loading=false;render()}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');reader.onerror=()=>reject(reader.error||Error('文件读取失败'));reader.readAsDataURL(file)})}
async function uploadOpsFiles(fileList){const xs=Array.from(fileList||[]);if(!xs.length)return;const task=opsActiveTaskForSession(opsActiveSession());if(!task?.id){OPS.error='请先发送明确动作生成任务草稿，再把文件上传到这个任务。';render();return}OPS.loading=true;OPS.error='';render();try{const files=await Promise.all(xs.map(async f=>({name:f.name,type:f.type||'application/octet-stream',dataBase64:await fileToBase64(f)})));await opsApi('/api/link-ops-assets',{method:'POST',body:JSON.stringify({taskId:task.id,files})});await loadOpsRuntime(true);await loadOpsAudit(task.id)}catch(e){OPS.error=e?.message||String(e);render()}finally{OPS.loading=false;render()}}

function render(){hideChartTip();shell();if(S.core==='loading'){$('view').innerHTML='<div class="loading"><span class="spin"></span><span>正在连接云端 BI runtime…</span></div>';return}if(S.core==='error'){$('view').innerHTML=`<div class="error"><b>云端 BI runtime 连接失败</b><br>${H(S.err)}<p><button class="btn" id="retryCore">重试</button></p></div>`;return}const map={home,orders:ordersPage,returns:returnsPage,products:productsPage,inventory:inventoryPage,traffic:trafficPage,reviews:reviewsPage,marketing:marketingPage,ops:opsPage,system:systemPage};const ns=S.tab==='system'?Object.keys(SL):needsFor(S.tab);$('view').innerHTML=staleNotice(ns)+(map[S.tab]||home)()}

function setRangeDate(role,date){if(!date)return;if(role==='end'){S.end=date;S.calendarEndMonth=calendarMonthStart(date)}else{S.start=date;S.calendarStartMonth=calendarMonthStart(date)}if(S.start&&S.end&&S.start>S.end){const t=S.start;S.start=S.end;S.end=t}S.rangePreset='custom';S.rangeOpen=true;S.orderPage=1;S.returnPage=1;S.productPage=1;S.trafficPage=1;rerenderWithEnsure()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!e.target.closest('#rangeDock')&&S.rangeOpen){S.rangeOpen=false;render()}if(!b)return;if(b.dataset.logout){logout();return}if(b.dataset.opsRefresh){loadOpsRuntime(true).catch(()=>{});return}if(b.dataset.opsDeleteSession){deleteOpsSession(b.dataset.opsDeleteSession);return}if(b.dataset.opsAudit){loadOpsAudit(b.dataset.opsAudit);return}if(b.dataset.opsFinalExecute){const txt=opsConfirmText(b.dataset.opsFinalExecute);if(txt!=='SHEIN_OPENAPI_SUBMIT'){OPS.error='最终提交前必须在任务确认区输入 SHEIN_OPENAPI_SUBMIT';render();return}executeOpsTask(b.dataset.opsFinalExecute,'execute',txt);return}if(b.dataset.opsResolve){resolveOpsTask(b.dataset.opsResolve,b.dataset.opsResolveStatus||'done');return}if(b.dataset.opsExecute){executeOpsTask(b.dataset.opsExecute,'dry-run');return}if(b.dataset.opsSession){S.opsActiveSessionId=b.dataset.opsSession;S.opsChatInput='';render();return}if(b.dataset.opsNewChat){S.opsActiveSessionId='__new__';S.opsChatInput='';render();setTimeout(()=>$('opsChatInput')?.focus(),0);return}if(b.dataset.opsTemplate){S.opsChatInput=b.dataset.opsTemplate||'';render();setTimeout(()=>$('opsChatInput')?.focus(),0);return}if(b.dataset.opsSend){sendOpsChat(false);return}if(b.dataset.opsDryrun){sendOpsChat(true);return}if(b.dataset.tab){S.tab=b.dataset.tab;if(VALID_TABS.has(S.tab))history.replaceState(null,'','#'+S.tab);render();ensure(S.tab,true);return}if(b.dataset.jump){S.tab=b.dataset.jump;render();ensure(S.tab,true);return}if(b.dataset.trendMetric){S.trendMetric=b.dataset.trendMetric;S.metric=S.trendMetric;render();ensure(S.tab,true);return}if(b.dataset.metric){S.trendMetric=b.dataset.metric;S.metric=b.dataset.metric;render();ensure(S.tab,true);return}if(b.dataset.preset){preset(Number(b.dataset.preset));return}if(b.dataset.rangePreset){applyPreset(b.dataset.rangePreset);rerenderWithEnsure();return}if(b.dataset.rangeToggle){S.rangeOpen=!S.rangeOpen;render();return}if(b.dataset.calendarDate){setRangeDate(b.dataset.calendarRole||'start',b.dataset.calendarDate);return}if(b.dataset.calendarShift){const role=b.dataset.calendarShift,delta=Number(b.dataset.calendarDelta||0);S.rangeOpen=true;if(role==='end')S.calendarEndMonth=addCalendarMonths(S.calendarEndMonth||S.end,delta);else S.calendarStartMonth=addCalendarMonths(S.calendarStartMonth||S.start,delta);render();return}if(b.dataset.load){load(b.dataset.load,false,true);return}if(b.dataset.trafficMetric){const set=ensureTrafficMetricSet(),k=String(b.dataset.trafficMetric||'');set.has(k)?set.delete(k):set.add(k);if(!set.size)TRAFFIC_METRICS.forEach(([x])=>set.add(x));render();return}if(b.dataset.trafficStatus){S.trafficStatus=b.dataset.trafficStatus||'on';S.trafficPage=1;render();return}if(b.dataset.trafficSort){const k=b.dataset.trafficSort;if(S.trafficSortKey===k)S.trafficSortDir=S.trafficSortDir==='asc'?'desc':'asc';else{S.trafficSortKey=k;S.trafficSortDir=['status','store','product','skc','tags'].includes(k)?'asc':'desc'}S.trafficPage=1;render();return}if(b.dataset.trafficPage){S.trafficPage=Number(b.dataset.trafficPage)||1;render();return}if(b.dataset.marketingPage){S.marketingPage=Number(b.dataset.marketingPage)||1;render();return}if(b.dataset.reviewSort){const k=b.dataset.reviewSort;if(S.reviewSortKey===k)S.reviewSortDir=S.reviewSortDir==='asc'?'desc':'asc';else{S.reviewSortKey=k;S.reviewSortDir=k==='star'?'asc':'desc'}render();return}if(b.dataset.orderStatus){S.orderStatus=b.dataset.orderStatus;S.orderPage=1;render();ensure(S.tab,true);return}if(b.dataset.productSort){const k=b.dataset.productSort;if(S.productSortKey===k)S.productSortDir=S.productSortDir==='asc'?'desc':'asc';else{S.productSortKey=k;S.productSortDir=['store','skc','tags','date'].includes(k)?'asc':'desc';}render();ensure(S.tab,true);return}if(b.dataset.loginRefresh){refreshLoginSessions();return}if(b.dataset.productStatus){const k=b.dataset.productStatus;const set=ensureProductStatusSet();if(k==='all'){set.clear();PRODUCT_PRIMARY_STATUSES.forEach(([v])=>set.add(v));}else{set.has(k)?set.delete(k):set.add(k);if(!set.size)PRODUCT_PRIMARY_STATUSES.forEach(([v])=>set.add(v));}S.productStatus=productStatusLabelText();S.productPage=1;render();ensure(S.tab,true);return}if(b.dataset.inventoryStatus){S.inventoryStatus=b.dataset.inventoryStatus;render();ensure(S.tab,true);return}if(b.dataset.inventoryShipStatus){S.inventoryShipStatus=b.dataset.inventoryShipStatus;render();ensure(S.tab,true);return}if(b.dataset.inventorySort){const k=b.dataset.inventorySort;if(S.inventorySortKey===k)S.inventorySortDir=S.inventorySortDir==='asc'?'desc':'asc';else{S.inventorySortKey=k;S.inventorySortDir=['product'].includes(k)?'asc':'desc';}render();ensure(S.tab,true);return}if(b.dataset.returnMode){S.returnsMode=b.dataset.returnMode;S.returnPage=1;render();ensure(S.tab,true);return}if(b.dataset.returnStatus){S.returnStatus=b.dataset.returnStatus;S.returnPage=1;render();ensure(S.tab,true);return}if(b.dataset.returnPage){S.returnPage=Number(b.dataset.returnPage)||1;render();return}if(b.dataset.productPage){S.productPage=Number(b.dataset.productPage)||1;render();return}if(b.dataset.returnReason){S.returnReason=b.dataset.returnReason;S.returnPage=1;render();return}if(b.dataset.returnClear){S.returnStatus='all';S.returnReason='all';S.returnRtv='all';S.returnPage=1;render();return}if(b.dataset.orderPage){S.orderPage=Number(b.dataset.orderPage)||1;render();return}if(b.dataset.homeStore){S.scope=b.dataset.homeStore;S.q='';S.orderPage=1;S.returnPage=1;S.productPage=1;S.trafficPage=1;rerenderWithEnsure();return}if(b.dataset.homeProduct){S.q=b.dataset.homeProduct;S.orderPage=1;S.returnPage=1;S.productPage=1;S.trafficPage=1;rerenderWithEnsure();return}if(b.id==='clearFilters'){S.marketingPage=1;S.marketingPageSize=80;S.q='';S.scope='ALL';S.orderPage=1;S.returnPage=1;S.productPage=1;S.returnStatus='all';S.returnReason='all';S.returnRtv='all';S.productStatus='all';S.productStatusSet=new Set(PRODUCT_PRIMARY_STATUSES.map(x=>x[0]));S.inventoryStatus='all';S.inventoryShipStatus='open';S.inventorySortKey='et';S.inventorySortDir='desc';S.trafficMetricSet=new Set(['exp','uv','cart','pay']);S.trafficStatus='on';S.trafficPage=1;S.trafficPageSize=80;S.trafficSortKey='exp';S.trafficSortDir='desc';S.reviewSortKey='date';S.reviewSortDir='desc';applyPreset('today');rerenderWithEnsure();return}if(b.id==='retryCore'){core();return}});
async function refreshLoginSessions(){const box=$('loginSessionBox');if(!box)return;box.innerHTML='<span class="pending">正在读取云端登录维护会话…</span>';try{const r=await fetch('/api/cloud-login/sessions',{cache:'no-store'});const j=await r.json().catch(()=>({ok:false,error:'Invalid JSON'}));if(!r.ok||j.ok===false)throw Error(j.error||('HTTP '+r.status));const raw=A(j.sessions);const sessions=raw.filter(s=>['starting','active'].includes(String(s?.status||''))||s?.alive?.xvfb||s?.alive?.websockify||s?.alive?.chrome);if(!sessions.length){box.innerHTML=`<div class="empty">当前没有临时登录窗口。历史已完成/已关闭会话 ${M(raw.length)} 条已隐藏；需要审计时打开完整维护中心。</div>`;return}box.innerHTML='<div class="login-session-list">'+sessions.map(s=>{const active=s.status==='active'||s.status==='starting';const cls=active?'active':s.status==='expired'?'expired':'idle';const open=active&&s.openUrl?`<a class="btn mini" href="${H(s.openUrl)}" target="_blank" rel="noreferrer">进入窗口</a>`:'';return`<div class="login-session-item ${H(cls)}"><b>${H(s.storeKey||'-')}</b><span>${H(s.status||'-')} · 到期 ${H(s.expiresAt||'-')}</span>${open}</div>`}).join('')+'</div>'}catch(e){box.innerHTML=`<div class="error"><b>读取登录会话失败</b><br>${H(e?.message||String(e))}<p><a class="btn" href="/cloud-login-maintenance" target="_blank" rel="noreferrer">打开完整维护中心</a></p></div>`}}
function chartTipEl(){let el=$('chartTooltip');if(!el){el=document.createElement('div');el.id='chartTooltip';el.className='chart-tooltip';document.body.appendChild(el)}return el}
function hideChartTip(){const el=$('chartTooltip');if(el)el.classList.remove('visible')}
function showChartTip(e,target){const text=target?.getAttribute('data-tip')||'';if(!text)return hideChartTip();const el=chartTipEl();el.textContent=text;const pad=14,w=260,h=120;let x=e.clientX+pad,y=e.clientY+pad;if(x+w>window.innerWidth)x=Math.max(12,e.clientX-w-pad);if(y+h>window.innerHeight)y=Math.max(12,e.clientY-h-pad);el.style.left=x+'px';el.style.top=y+'px';el.classList.add('visible')}
document.addEventListener('mousemove',e=>{const t=e.target?.closest?.('[data-tip]');if(t)showChartTip(e,t);else hideChartTip()});
document.addEventListener('mouseleave',hideChartTip,true);

document.addEventListener('input',e=>{if(e.target?.id==='q'){S.q=e.target.value||'';S.orderPage=1;S.returnPage=1;S.productPage=1;S.trafficPage=1;S.marketingPage=1;render();ensure(S.tab,true);return}if(e.target?.id==='opsChatInput'){S.opsChatInput=e.target.value||'';return}});
