name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    # The full deterministic matrix includes the isolated Portal integration
    # flows plus the product-attribute flow, which now measures about 20 minutes
    # by itself. Keep a bounded 45-minute job budget so per-test fail-fast
    # timeouts can report the actual failure instead of GitHub cancelling first.
    timeout-minutes: 45
    steps:
      # v7 actions pinned to immutable commits; Dependabot owns future bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
