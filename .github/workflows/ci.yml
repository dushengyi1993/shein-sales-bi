name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    # The full deterministic matrix includes three isolated Portal integration
    # flows and currently takes about 15 minutes on GitHub-hosted runners.
    # Keep a bounded 2x job-level budget so the per-test fail-fast timeouts can
    # report the actual failing test instead of GitHub cancelling the whole job.
    timeout-minutes: 30
    steps:
      # v7 actions pinned to immutable commits; Dependabot owns future bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
