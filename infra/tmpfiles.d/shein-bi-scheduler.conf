# SHEIN BI half-managed coordination files under /run/lock.
#
# These are neutral flock files, not unit control files: run_host_heavy_job.sh
# and run_host_browser_read_job.sh take the host, project, domain and browser
# slots from here. They must exist before any job starts, otherwise the wrapper
# records browser_slot_invalid/neutral_lock_invalid and defers with 73.
#
# Browser capacity === number of shein-browser-read-N.lock files below. Raise
# both this list and SHEIN_BROWSER_READ_SLOTS together; the two-slot default in
# the wrappers applies when the environment does not override the count.
#
# Since the 2026-09-15 fnOS migration the half-managed project runs on its own
# Linux VM, so it owns these entries instead of relying on the shared-host
# tmpfiles maintained by the full-managed project.
f /run/lock/shein-host-heavy.lock 0666 root root -
f /run/lock/shein-browser-read-0.lock 0666 root root -
f /run/lock/shein-browser-read-1.lock 0666 root root -
f /run/lock/shein-browser-read-2.lock 0666 root root -
f /run/lock/shein-browser-read-3.lock 0666 root root -
f /run/lock/shein-pending-discuss-write.lock 0666 root root -
f /run/lock/shein-bi-pending-discuss-window.lock 0644 root root -
