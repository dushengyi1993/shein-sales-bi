global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 2m
    timeout server 2m

frontend fe_ssh_or_https
    bind *:443
    tcp-request inspect-delay 5s
    acl is_ssh req.payload(0,4) -m str SSH-
    acl is_tls req.ssl_hello_type 1
    acl is_shein_bi_sni req.ssl_sni -i sa.dushengyi.cc
    acl is_cloudflare src 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    tcp-request content reject if is_tls is_shein_bi_sni !is_cloudflare
    # Do not accept on the first partial byte: wait until SSH or a complete TLS
    # ClientHello is recognizable, otherwise the SNI/source reject can be
    # bypassed before HAProxy has enough bytes to evaluate it.
    tcp-request content accept if is_ssh
    tcp-request content accept if is_tls
    use_backend bk_ssh if is_ssh
    use_backend bk_https if is_tls
    default_backend bk_ssh

backend bk_ssh
    server ssh_local 127.0.0.1:22 check

backend bk_https
    server caddy_https 127.0.0.1:10443 check
