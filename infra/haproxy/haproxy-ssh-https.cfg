global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 2m
    timeout server 2m

frontend fe_ssh_or_https
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len gt 0 }
    acl is_ssh req.payload(0,4) -m str SSH-
    acl is_tls req.ssl_hello_type 1
    use_backend bk_ssh if is_ssh
    use_backend bk_https if is_tls
    default_backend bk_ssh

backend bk_ssh
    server ssh_local 127.0.0.1:22 check

backend bk_https
    server caddy_https 127.0.0.1:10443 check
