server {
    listen 127.0.0.1:8080;
    server_name sa.dushengyi.cc 43.165.167.135 localhost;

    access_log /var/log/nginx/shein-bi-access.log;
    error_log /var/log/nginx/shein-bi-error.log;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    client_max_body_size 35m;

    # Public, machine-to-machine callback. Signature validation remains the
    # primary control; the official push IP list is a second independent layer.
    location = /api/shein/webhook/v1/events {
        client_max_body_size 1m;
        limit_except POST { deny all; }
        allow 120.24.77.228;
        allow 8.129.229.113;
        allow 8.129.226.74;
        allow 8.129.9.82;
        allow 8.129.7.84;
        allow 47.106.180.122;
        allow 120.79.71.235;
        allow 47.112.201.95;
        allow 47.112.17.164;
        allow 47.106.77.136;
        allow 8.138.164.6;
        allow 8.134.140.235;
        allow 8.219.56.57;
        allow 8.219.138.159;
        allow 47.244.123.114;
        allow 8.210.12.12;
        allow 52.34.71.36;
        allow 44.229.47.182;
        allow 52.40.22.133;
        allow 34.208.2.54;
        allow 52.37.43.177;
        allow 100.20.197.247;
        allow 52.21.82.95;
        allow 44.218.161.133;
        deny all;

        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 250ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 1400ms;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates public TLS before this internal HTTP hop. Preserve
        # its external scheme so the Portal's same-origin guard sees HTTPS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
