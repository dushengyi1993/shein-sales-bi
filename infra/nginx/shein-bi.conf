# Auth-only failover pair. Query (8788) is authoritative for the three
# authenticated routes below; Portal (8787) is a warm backup that shares the
# same session secret/cookie, so an auth response from either runtime is
# interchangeable. The 'backup' server is only contacted when the primary is
# unreachable or fails per proxy_next_upstream, never otherwise. This block
# lives at the top of the server file, which is included from the nginx
# http{} context on the host (same layout as shein-bi-webhook-limits.conf).
upstream shein_bi_auth {
    server 127.0.0.1:8788;
    server 127.0.0.1:8787 backup;
}

server {
    listen 127.0.0.1:8080;
    server_name sa.dushengyi.cc 43.165.167.135 localhost;

    access_log /var/log/nginx/shein-bi-access.log;
    error_log /var/log/nginx/shein-bi-error.log;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    client_max_body_size 35m;

    # Public machine-to-machine callback. Direct origin HTTPS is multiplexed
    # through TCP-mode HAProxy, so the standard 443 path cannot recover the
    # original peer address. Bound the shared ingress here and rely on the
    # official SHEIN HMAC signature as the authorization control.
    location = /api/shein/webhook/v1/events {
        client_max_body_size 1m;
        limit_except POST { deny all; }
        limit_req zone=shein_bi_webhook_ingress burst=200 nodelay;
        limit_req_status 429;
        limit_conn shein_bi_webhook_connections 40;

        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 250ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 1400ms;
    }

    # Authenticated surface with active/backup fault isolation. Query (8788)
    # is authoritative; Portal (8787) is a warm backup. Failover is limited
    # to genuine upstream failures: connection errors, timeouts, or HTTP
    # 502/503/504. Any 4xx or other 5xx is a business answer and is returned
    # to the client untouched, never replayed against the backup. Nginx
    # request buffering stays at its default (on) so the buffered request
    # body allows the exact-POST replay; non_idempotent is what enables that
    # replay for the POST /api/login and /api/logout routes after the request
    # was already sent, and proxy_next_upstream_tries bounds it to 2.
    location = /api/login {
        client_max_body_size 64k;
        limit_except POST { deny all; }
        proxy_pass http://shein_bi_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    location = /api/logout {
        client_max_body_size 1k;
        limit_except POST { deny all; }
        proxy_pass http://shein_bi_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    location = /api/auth/me {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://shein_bi_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    # Query-exclusive read surface. These routes must NEVER fall back to the
    # full Portal on 8787: proxy_next_upstream is explicitly off and the
    # proxy_pass targets the Query socket directly, so any failure (including
    # a down Query runtime) terminates here with a gateway error instead of
    # being served by stale Portal data.
    location = /api/bi/query-data {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
    }

    location = /api/partner-cli/package {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    location = /api/partner-cli/manifest {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    location = /api/partner-cli/bundle {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    location = /api/owner-knowledge/manifest {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    location = /api/owner-knowledge/bundle {
        client_max_body_size 1k;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 500ms;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates public TLS before this internal HTTP hop. Preserve
        # its external scheme so the Portal's same-origin guard sees HTTPS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
