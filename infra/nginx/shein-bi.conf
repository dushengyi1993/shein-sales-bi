server {
    listen 127.0.0.1:8080;
    server_name shein-bi.faceair.me 43.165.167.135 localhost;

    access_log /var/log/nginx/shein-bi-access.log;
    error_log /var/log/nginx/shein-bi-error.log;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    auth_basic "SHEIN BI";
    auth_basic_user_file /srv/shein-bi/secrets/bi_basic_auth.htpasswd;

    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
