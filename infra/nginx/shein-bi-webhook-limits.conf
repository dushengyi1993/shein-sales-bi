# Loaded from nginx.conf's http{} include. HAProxy is a TCP pass-through hop,
# so standard-443 requests share Caddy's loopback address at nginx. This is a
# global ingress budget; the receiver still rejects every invalid signature.
limit_req_zone $binary_remote_addr zone=shein_bi_webhook_ingress:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=shein_bi_webhook_connections:10m;
