[Service]
# 2026-09-15: the 2 vCPU cloud host had to run store fetches one at a time.
# This value must equal the number of browser-read lanes (SHEIN_BROWSER_READ_SLOTS
# and the shein-browser-read-N.lock entries in infra/tmpfiles.d). Each per-store
# worker consumes exactly one lane: scripts/run_host_browser_read_job.sh takes it
# non-blocking and exits 75 when every lane is held, so a larger value adds no
# capacity and only leaves the surplus workers polling for a free lane.
Environment=SHEIN_LINK_BUSINESS_BROWSER_CONCURRENCY=4

