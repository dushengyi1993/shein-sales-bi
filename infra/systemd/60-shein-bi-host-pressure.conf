# 2026-09-15: the compiled pressure thresholds in scripts/check_host_resource_pressure.mjs
# were tuned on the 2 vCPU / 7.5 GiB old cloud host. The fnOS VM (6 vCPU / 8 GiB on a
# Ryzen 5 5600G host) needs its guard re-baselined, otherwise ioFullAvg10 and the
# minimum uptime keep deferring jobs that the machine can easily run.
#
# The guard prints thresholdOverrides + defaultProfile whenever these differ from the
# compiled defaults, so every deferral log stays auditable. Values stay conservative:
# they unblock the machine without removing the memory and IO fail-closed checks.
[Manager]
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MINIMUM_UPTIME_SECONDS=240
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MINIMUM_AVAILABLE_MEMORY_MIB=1024
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MAXIMUM_LOAD_PER_CPU=1.5
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MAXIMUM_CPU_BUSY_RATIO_WHEN_LOAD_HIGH=0.9
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MAXIMUM_MEMORY_FULL_AVG10=4
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_MAXIMUM_IO_FULL_AVG10=20
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MINIMUM_UPTIME_SECONDS=240
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MINIMUM_AVAILABLE_MEMORY_MIB=1024
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MAXIMUM_LOAD_PER_CPU=1.5
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MAXIMUM_CPU_BUSY_RATIO_WHEN_LOAD_HIGH=0.9
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MAXIMUM_MEMORY_FULL_AVG10=4
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_BROWSER_SECONDARY_MAXIMUM_IO_FULL_AVG10=20
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MINIMUM_UPTIME_SECONDS=240
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MINIMUM_AVAILABLE_MEMORY_MIB=1024
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MAXIMUM_LOAD_PER_CPU=1.6
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MAXIMUM_CPU_BUSY_RATIO_WHEN_LOAD_HIGH=0.9
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MAXIMUM_MEMORY_FULL_AVG10=4
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_OPENAPI_MAXIMUM_IO_FULL_AVG10=24
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MINIMUM_UPTIME_SECONDS=240
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MINIMUM_AVAILABLE_MEMORY_MIB=1024
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MAXIMUM_LOAD_PER_CPU=1.5
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MAXIMUM_CPU_BUSY_RATIO_WHEN_LOAD_HIGH=0.9
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MAXIMUM_MEMORY_FULL_AVG10=4
DefaultEnvironment=SHEIN_BI_HOST_PRESSURE_MATERIALIZER_MAXIMUM_IO_FULL_AVG10=20

