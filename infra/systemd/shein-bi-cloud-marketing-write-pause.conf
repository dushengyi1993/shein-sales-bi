# Persistent pause switch for the bounded cloud marketing write lane.
#
# Install as:
#   /etc/systemd/system/shein-bi-cloud-marketing-repair.service.d/60-marketing-write-pause.conf
# and delete the old transient form, which vanished on every reboot:
#   /run/systemd/system/shein-bi-cloud-marketing-repair.service.d/99-main-7032-pause.conf
#
# The lane starts only while the marker does NOT exist, so it is paused by
# creating the marker and resumed by removing it:
#   sudo node scripts/manage_marketing_write_pause.mjs set --reason "<why>" [--expires-at <ISO>]
#   sudo node scripts/manage_marketing_write_pause.mjs clear --reason "<why>"
#   node scripts/manage_marketing_write_pause.mjs status
#
# Both actions require a real reason and append to
# marketing-write-pause.audit.ndjson: a reasonless marker once stopped the whole
# cloud write chain for three days with no record of who paused it or why.
[Unit]
ConditionPathExists=!/var/lib/shein-bi-control/marketing-write-pause.json
